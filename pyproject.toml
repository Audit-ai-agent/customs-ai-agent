[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "customs-ai-agent"
version = "0.2.0"
description = "Evidence-bound customs document review agent workflow"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.117.0",
  "langgraph>=0.2.0",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "rapidfuzz>=3.9",
]

[dependency-groups]
dev = [
  "build>=1.2.2",
  "jsonschema[format]>=4.23",
  "mypy>=1.11",
  "pytest>=8.3,<10",
  "ruff>=0.8",
]

[project.scripts]
customs-ai-agent = "customs_ai_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
customs_ai_agent = ["prompts/*.txt"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["_artifacts", "dist", "build"]

[tool.ruff.lint]
# MVP 코드의 동작을 바꾸는 대규모 자동 정리 없이 오류성 규칙부터 강제한다.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
files = ["src/customs_ai_agent"]
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
warn_unused_configs = true

[[tool.mypy.overrides]]
# LangGraph의 StateGraph generic은 dict 기반 node와 ReviewState TypedDict를 현재 정확히 결합하지
# 못한다. workflow 이외의 도메인/계약 코드는 계속 검사하고 이 adapter 경계만 별도 추적한다.
module = "customs_ai_agent.graph.workflow"
disable_error_code = ["arg-type", "type-var"]
