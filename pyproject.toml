[build-system]
requires = ["setuptools==83.0.0", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "customs-ai-agent"
version = "0.3.0"
description = "Evidence-bound customs document review agent workflow"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115,<1",
  # Raster OCR v2 always needs local PDF/image decoding.  The heavy Paddle
  # stack remains isolated in the hash-pinned sidecar bundle.
  "pillow==10.4.0",
  "pydantic>=2.7,<3",
  "pypdfium2==4.30.0",
  "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
# Only the person explicitly running the real Claude functional UAT installs this.
functional-uat = ["anthropic>=0.117.0,<1"]
# These extras are never installed by normal service startup.  An operator
# explicitly provisions one pinned local profile, records its inventory under
# _local/data/document-preview, and starts the service with its approval hash.
document-preview-pdf = ["pypdf==5.3.1"]
document-preview-paddleocr = [
  "paddleocr==2.9.1",
  "paddlepaddle==2.6.2",
  "pypdf==5.3.1",
  "pypdfium2==4.30.0",
]
document-preview-docling = [
  "docling==2.15.1",
  # Docling 2.15.1 uses the legacy BoundingBox API.  Its broad upstream
  # ranges otherwise resolve to newer incompatible package lines.
  "docling-core[chunking]==2.13.1",
  "docling-ibm-models==3.1.0",
  "docling-parse==3.0.0",
  "pillow==10.4.0",
  "pypdf==5.3.1",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.11",
  "pytest>=8.3,<10",
  "ruff>=0.8",
]

[project.scripts]
customs-ai-agent = "customs_ai_agent.service.__main__:main"
customs-ai-agent-serve = "customs_ai_agent.service.__main__:main"
customs-ai-agent-dev-serve = "customs_ai_agent.service.__main__:dev_main"
customs-ai-agent-functional-uat-serve = "customs_ai_agent.service.__main__:functional_uat_main"
customs-ai-agent-verify-knowledge-transcript = "customs_ai_agent.knowledge_transcript_verifier:main"
# Installed only in an explicitly provisioned, hash-pinned local OCR runtime.
# It is never invoked by normal service startup.
customs-ai-agent-ppstructurev3-sidecar = "customs_ai_agent.service.ppstructurev3_sidecar:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
customs_ai_agent = [
  "prompts/*.txt",
]
"customs_ai_agent.contracts" = [
  "evidence/v3/*.json",
  "schemas/backend/v3/*.json",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["_artifacts", "dist", "build"]

[tool.ruff.lint]
# MVP 코드의 동작을 바꾸는 대규모 자동 정리 없이 오류성 규칙부터 강제한다.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
files = ["src/customs_ai_agent"]
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
warn_unused_configs = true
