name: Raster OCR OCI publish

on:
  workflow_dispatch:
    inputs:
      runtime_image:
        description: "Digest-pinned private GHCR runtime image (ghcr.io/...@sha256:...)"
        required: false
        type: string
  push:
    tags:
      - "ocr-oci-v*"

concurrency:
  group: raster-ocr-oci-publish
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
      image: ${{ steps.release.outputs.image_repository }}
      immutable_ref: ${{ steps.result.outputs.immutable_ref }}
    steps:
      - name: Resolve immutable release inputs
        id: release
        shell: bash
        env:
          DISPATCH_RUNTIME_IMAGE: ${{ inputs.runtime_image }}
          CONFIGURED_RUNTIME_IMAGE: ${{ vars.CUSTOMS_AGENT_RASTER_RUNTIME_IMAGE }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "manual_publish_requires_main" >&2
            exit 1
          fi
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repository="${GITHUB_REPOSITORY,,}"
          runtime_image="${DISPATCH_RUNTIME_IMAGE:-${CONFIGURED_RUNTIME_IMAGE:-}}"
          if [[ ! "${runtime_image}" =~ ^ghcr\.io/${owner}/[a-z0-9][a-z0-9._/-]*@sha256:[a-f0-9]{64}$ ]]; then
            echo "digest_pinned_org_runtime_image_required" >&2
            exit 1
          fi
          image_repository="ghcr.io/${repository}-raster-ocr"
          tags="${image_repository}:sha-${GITHUB_SHA}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            [[ "${GITHUB_REF_NAME}" =~ ^ocr-oci-v[0-9][A-Za-z0-9._-]*$ ]] || {
              echo "release_tag_invalid" >&2
              exit 1
            }
            tags+=$'\n'"${image_repository}:${GITHUB_REF_NAME}"
          fi
          {
            echo "runtime_image=${runtime_image}"
            echo "image_repository=${image_repository}"
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Log in to private GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Verify runtime digest is readable
        shell: bash
        env:
          RUNTIME_IMAGE: ${{ steps.release.outputs.runtime_image }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${RUNTIME_IMAGE}" >/dev/null

      - name: Require private GHCR input and output packages
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT_IMAGE: ${{ steps.release.outputs.image_repository }}
          RUNTIME_IMAGE: ${{ steps.release.outputs.runtime_image }}
        run: |
          set -euo pipefail
          python3 deploy/ocr-oci/verify_ghcr_private_package.py --image "${RUNTIME_IMAGE}"
          python3 deploy/ocr-oci/verify_ghcr_private_package.py --image "${OUTPUT_IMAGE}"

      - name: Build and publish immutable Agent plus OCR image
        id: publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/ocr-oci/Dockerfile
          target: release
          platforms: linux/amd64
          push: true
          tags: ${{ steps.release.outputs.tags }}
          build-args: |
            RASTER_RUNTIME_IMAGE=${{ steps.release.outputs.runtime_image }}
            SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=raster-ocr-linux-amd64
          cache-to: type=gha,mode=max,scope=raster-ocr-linux-amd64
          provenance: mode=max
          sbom: true

      - name: Verify and report immutable image digest
        id: result
        shell: bash
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_REPOSITORY: ${{ steps.release.outputs.image_repository }}
          RUNTIME_IMAGE: ${{ steps.release.outputs.runtime_image }}
        run: |
          set -euo pipefail
          [[ "${DIGEST}" =~ ^sha256:[a-f0-9]{64}$ ]] || {
            echo "published_digest_missing" >&2
            exit 1
          }
          immutable_ref="${IMAGE_REPOSITORY}@${DIGEST}"
          docker buildx imagetools inspect "${immutable_ref}" >/dev/null
          python3 deploy/ocr-oci/verify_ghcr_private_package.py --image "${immutable_ref}"
          echo "immutable_ref=${immutable_ref}" >> "${GITHUB_OUTPUT}"
          {
            echo "### Raster OCR OCI publication"
            echo
            echo "- Agent source: \`${GITHUB_SHA}\`"
            echo "- Runtime input: \`${RUNTIME_IMAGE}\`"
            echo "- Deploy exactly: \`${immutable_ref}\`"
            echo "- OCI provenance and SBOM attestations: enabled"
          } >> "${GITHUB_STEP_SUMMARY}"
