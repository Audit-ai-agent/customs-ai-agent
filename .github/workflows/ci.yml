name: ai-agent-ci

on:
  pull_request:
    paths:
      - ".dockerignore"
      - ".github/workflows/**"
      - ".gitleaks.toml"
      - ".gitignore"
      - "pyproject.toml"
      - "uv.lock"
      - "README.md"
      - "docs/**"
      - "deploy/**"
      - "src/**"
      - "tests/**"
      - "tools/**"
  push:
    branches: [main]
    paths:
      - ".dockerignore"
      - ".github/workflows/**"
      - ".gitleaks.toml"
      - ".gitignore"
      - "pyproject.toml"
      - "uv.lock"
      - "README.md"
      - "docs/**"
      - "deploy/**"
      - "src/**"
      - "tests/**"
      - "tools/**"

concurrency:
  group: ai-agent-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          python-version: "3.11"
      - name: Verify lockfile is current
        run: uv lock --check
      - name: Install locked development environment
        run: uv sync --locked --group dev
      - name: Lint
        run: uv run --locked --group dev ruff check src tests
      - name: Format
        run: uv run --locked --group dev ruff format --check src tests
      - name: Typecheck
        run: uv run --locked --group dev mypy
      - name: Unit and contract tests
        run: uv run --locked --group dev pytest -q
      - name: Verify asset-free OCR OCI deployment sources
        run: |
          uv run --locked --group dev ruff check \
            deploy/ocr-oci \
            tools/export_raster_text_oci_runtime.py \
            tools/raster_text_oci_evidence.py \
            tools/raster_text_oci_metadata.py \
            tools/verify_raster_text_oci_runtime.py
          uv run --locked --group dev ruff format --check \
            deploy/ocr-oci \
            tools/export_raster_text_oci_runtime.py \
            tools/raster_text_oci_evidence.py \
            tools/raster_text_oci_metadata.py \
            tools/verify_raster_text_oci_runtime.py
          python deploy/ocr-oci/verify_deployment_sources.py --repository-root .
          python deploy/ocr-oci/selftest_github_release_environment.py
          python deploy/ocr-oci/selftest_ocr_readiness.py
          python deploy/ocr-oci/selftest_ghcr_private_package.py
          uv run --locked --group dev python deploy/ocr-oci/selftest_runtime_contract.py
          bash -n deploy/ocr-oci/publish_runtime_context.sh
      - name: Build source-only OCI structure target
        run: |
          docker buildx build \
            --file deploy/ocr-oci/placeholder/Dockerfile \
            --platform linux/amd64 \
            --build-arg SOURCE_REPOSITORY=https://github.com/example/example \
            deploy/ocr-oci/placeholder
          docker buildx build \
            --file deploy/ocr-oci/Dockerfile \
            --platform linux/amd64 \
            --target app-structure \
            --check \
            .
      - name: Redacted secret scan
        shell: bash
        run: |
          set -euo pipefail
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --status -
          tar -xzf "$archive" gitleaks
          scan_root="$(mktemp -d)"
          git archive --format=tar HEAD | tar -x -C "$scan_root"
          ./gitleaks dir "$scan_root" --config .gitleaks.toml --redact --no-banner --exit-code 1
