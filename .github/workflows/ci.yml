name: ai-agent-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"
          python-version: "3.11"
          enable-cache: true
      - name: Install locked development environment
        run: uv sync --locked --group dev
      - name: Lint
        run: uv run ruff check .
      - name: Typecheck
        run: uv run mypy
      - name: Test
        run: uv run pytest -q
      - name: Build wheel
        run: uv build --wheel
