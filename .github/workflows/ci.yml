name: ai-agent-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          python-version: "3.11"
          enable-cache: true
      - name: Verify lockfile is current
        run: uv lock --check
      - name: Install locked development environment
        run: uv sync --locked --group dev
      - name: Lint
        run: uv run --locked ruff check .
      - name: Format
        run: uv run --locked ruff format --check src tests evals tools
      - name: Typecheck
        run: uv run --locked mypy
      - name: Verify public contracts and focused offline regressions
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked python tools/verify_service_openapi.py
          uv run --locked pytest -q \
            tests/service/test_openapi.py \
            tests/test_packaged_contracts.py \
            tests/test_evidence_contract_lock.py \
            tests/test_evidence_runtime_release_v2.py \
            tests/test_evidence_v3_consumer.py \
            tests/test_v1_wire_compatibility.py
