name: customs-ai-agent

services:
  agent:
    image: customs-ai-agent:${CUSTOMS_AGENT_BUILD_SHA:?set exact Git SHA}
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        AGENT_WHEEL: dist/wheel/customs_ai_agent-0.3.0-py3-none-any.whl
        BUILD_SHA: ${CUSTOMS_AGENT_BUILD_SHA:?set exact Git SHA}
        WHEEL_SHA256: ${CUSTOMS_AGENT_WHEEL_SHA256:?set exact wheel SHA-256}
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set Anthropic credential}
      CUSTOMS_AGENT_BUILD_SHA: ${CUSTOMS_AGENT_BUILD_SHA:?set exact Git SHA}
      CUSTOMS_AGENT_ENVIRONMENT: production
      CUSTOMS_AGENT_HOST: 0.0.0.0
      CUSTOMS_AGENT_LOG_LEVEL: INFO
      CUSTOMS_AGENT_MAX_BODY_BYTES: 2097152
      CUSTOMS_AGENT_MAX_CONCURRENCY: 2
      CUSTOMS_AGENT_MAX_DOCUMENTS: 6
      CUSTOMS_AGENT_MAX_TEXT_CHARACTERS: 500000
      CUSTOMS_AGENT_BODY_READ_TIMEOUT_SECONDS: 15
      CUSTOMS_AGENT_PORT: 8080
      CUSTOMS_AGENT_QUEUE_WAIT_SECONDS: 1
      CUSTOMS_AGENT_READINESS_TIMEOUT_SECONDS: 5
      CUSTOMS_AGENT_READINESS_TTL_SECONDS: 5
      CUSTOMS_AGENT_REPLAY_MAX_ENTRIES: 1000
      CUSTOMS_AGENT_REPLAY_MAX_BYTES: 67108864
      CUSTOMS_AGENT_REPLAY_TTL_SECONDS: 600
      CUSTOMS_AGENT_RUN_TIMEOUT_SECONDS: 420
      CUSTOMS_AGENT_SERVICE_BEARER_TOKEN: ${CUSTOMS_AGENT_SERVICE_BEARER_TOKEN:?set service credential}
      CUSTOMS_AGENT_SHUTDOWN_GRACE_SECONDS: 30
      CUSTOMS_AGENT_WHEEL_SHA256: ${CUSTOMS_AGENT_WHEEL_SHA256:?set exact wheel SHA-256}
      EVIDENCE_SERVICE_ALLOWED_ORIGINS: ${EVIDENCE_SERVICE_ALLOWED_ORIGINS:?set exact HTTPS origin}
      EVIDENCE_SERVICE_BASE_URL: ${EVIDENCE_SERVICE_BASE_URL:?set Evidence URL}
      EVIDENCE_SERVICE_TOKEN: ${EVIDENCE_SERVICE_TOKEN:?set Evidence bearer credential}
      EVIDENCE_SERVICE_TOKEN_HEADER: Authorization
    ports:
      - "127.0.0.1:${CUSTOMS_AGENT_PUBLISHED_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    pids_limit: 256
    mem_limit: 1g
    cpus: 2.0
    stop_grace_period: 45s
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          'http://127.0.0.1:8080/health/live', timeout=2).read()
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3
